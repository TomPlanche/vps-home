# The services of the home page. Copy this file to services.toml, or point
# SERVICES_FILE at another path, then describe your own services.
#
# One [[service]] table per card, in the order of the page. The cards of the
# same group sit together, and the groups keep the order of their first card.
#
#   name         what the card says, unique in the file
#   url          where the card links to (http or https)
#   group        the section of the card, "Services" when left out
#   description  a line under the name
#   host         the machine the service runs on
#   icon         an image for the card: a URL, or a path on this site. Left
#                out, or when it does not load, the card shows the initials.
#   check        what the server requests to tell whether the service answers:
#                left out, it requests `url`; a URL requests that address
#                instead (a health endpoint, a private address); false turns
#                the check off. Below 400 is up, 400 and above is failing, no
#                answer in 5 s is down. A redirect counts as up, unfollowed.
#
# A [service.widget] table adds a few numbers of the service, read from its API:
#
#   type         the API: "paperless" or "immich"
#   api          the base URL of the API, `url` when left out
#   token_env    the environment variable that holds the token of the API.
#                The token itself stays out of this file.

[[service]]
name = "Grafana"
group = "Monitoring"
url = "https://grafana.example.com"
description = "Dashboards of the metrics"
host = "home"
icon = "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/grafana.svg"
check = "http://10.0.0.4:3030/api/health"

[[service]]
name = "Uptime Kuma"
group = "Monitoring"
url = "https://status.example.com"
description = "Uptime of the public sites"
host = "vps"

[[service]]
name = "Immich"
group = "Media"
url = "https://photos.example.com"
description = "Photos and videos"
host = "home"
icon = "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/immich.svg"

[service.widget]
type = "immich"
api = "http://10.0.0.4:2283"
token_env = "IMMICH_API_KEY"

[[service]]
name = "Paperless"
group = "Documents"
url = "http://10.0.0.4:8000"
description = "Scanned documents"
host = "home"

[service.widget]
type = "paperless"
token_env = "PAPERLESS_TOKEN"

[[service]]
name = "Forgejo"
group = "Code"
url = "https://git.example.com"
description = "Git repositories"
host = "home"
check = "http://10.0.0.4:3000/api/healthz"
